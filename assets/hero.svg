<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Dark Dot Pattern Background -->
    <pattern id="hero-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#162035" opacity="0.6"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="hero-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1a2744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="hero-avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <linearGradient id="hero-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Clip Path for Name Reveal -->
    <clipPath id="hero-name-clip">
      <rect x="50" y="110" width="500" height="70"/>
    </clipPath>

    <style>
      .hero-bg { fill: #070b16; }
      .hero-title-mask {
        animation: hero-name-rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }
      .hero-greeting {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #247bff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        animation: hero-fade-in 0.8s ease 0.1s both;
      }
      .hero-name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: url(#hero-text-grad);
        letter-spacing: -0.5px;
      }
      .hero-pitch {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #94a3b8;
        animation: hero-fade-in 0.8s ease 0.8s both;
      }
      .hero-badge {
        animation: hero-fade-in 0.8s ease 1.0s both;
      }
      .hero-avatar-group {
        transform-box: fill-box;
        transform-origin: center;
        animation: hero-avatar-float 4s ease-in-out infinite alternate;
      }
      .hero-role {
        font-family: "SF Mono", Monaco, Menlo, Consolas, "Ubuntu Mono", monospace;
        font-size: 18px;
        font-weight: 600;
        fill: #38bdf8;
        opacity: 0;
      }
      .hero-role-1 { opacity: 1; animation: hero-cycle-1 12s infinite; }
      .hero-role-2 { animation: hero-cycle-2 12s infinite; }
      .hero-role-3 { animation: hero-cycle-3 12s infinite; }
      .hero-role-4 { animation: hero-cycle-4 12s infinite; }

      @keyframes hero-name-rise {
        from { transform: translateY(70px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes hero-fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes hero-avatar-float {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-8px) scale(1.02); }
      }

      /* Role cycling keyframes: 4 roles across 12s (3s each, 25% window) */
      @keyframes hero-cycle-1 {
        0%, 3% { opacity: 0; transform: translateY(8px); }
        6%, 22% { opacity: 1; transform: translateY(0px); }
        25%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes hero-cycle-2 {
        0%, 25% { opacity: 0; transform: translateY(8px); }
        28%, 47% { opacity: 1; transform: translateY(0px); }
        50%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes hero-cycle-3 {
        0%, 50% { opacity: 0; transform: translateY(8px); }
        53%, 72% { opacity: 1; transform: translateY(0px); }
        75%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes hero-cycle-4 {
        0%, 75% { opacity: 0; transform: translateY(8px); }
        78%, 97% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-8px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-title-mask, .hero-greeting, .hero-pitch, .hero-badge, .hero-avatar-group {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
        .hero-role { display: none; }
        .hero-role-1 { display: block; opacity: 1 !important; transform: none !important; animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" rx="16" fill="#070b16"/>
  <rect width="800" height="420" rx="16" fill="url(#hero-dots)"/>
  
  <!-- Outer hairline gradient border -->
  <rect x="1" y="1" width="798" height="418" rx="15" fill="none" stroke="url(#hero-border-grad)" stroke-width="1.5"/>

  <!-- Left Content Column -->
  <!-- Top decorative prompt label -->
  <g class="hero-greeting">
    <circle cx="58" cy="72" r="4" fill="#247bff"/>
    <text x="72" y="77">SYSTEM.INIT // HELLO WORLD</text>
  </g>

  <!-- Animated Rising Name -->
  <g clip-path="url(#hero-name-clip)">
    <g class="hero-title-mask">
      <text x="50" y="162" class="hero-name">JITINPAL SINGH</text>
    </g>
  </g>

  <!-- Cycling Roles Section -->
  <g transform="translate(50, 205)">
    <!-- Terminal prompt symbol -->
    <text x="0" y="0" font-family="monospace" font-size="18" font-weight="bold" fill="#ff354f">&gt;</text>
    <text x="20" y="0" class="hero-role hero-role-1">STUDENT &amp; EXPLORER</text>
    <text x="20" y="0" class="hero-role hero-role-2">PROBLEM SOLVER</text>
    <text x="20" y="0" class="hero-role hero-role-3">PYTHON &amp; C++ DEV</text>
    <text x="20" y="0" class="hero-role hero-role-4">SYSTEM BUILDER</text>
  </g>

  <!-- Personal Pitch / Philosophy -->
  <g class="hero-pitch">
    <text x="50" y="250">"I love racking my brain on hard problems."</text>
  </g>

  <!-- Details / Metadata Badges -->
  <g transform="translate(50, 290)"><g class="hero-badge">
    <!-- Location Badge -->
    <rect x="0" y="0" width="165" height="36" rx="18" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="23" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">📍 New Delhi, India</text>

    <!-- Status Badge -->
    <rect x="180" y="0" width="160" height="36" rx="18" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <circle cx="198" cy="18" r="4" fill="#10b981"/>
    <text x="210" y="23" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">Currently Student</text>
  </g></g>

  <!-- Focus Tags Row -->
  <g transform="translate(50, 348)"><g class="hero-badge">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="45" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">PYTHON</text>

    <rect x="100" y="0" width="70" height="26" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="135" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">C++</text>

    <rect x="180" y="0" width="80" height="26" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="220" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">AI / ML</text>

    <rect x="270" y="0" width="105" height="26" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="322" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">ALGORITHMS</text>
  </g></g>

  <!-- Right Visual Avatar Emblem -->
  <g transform="translate(620, 190)"><g class="hero-avatar-group">
    <!-- Ambient glow circle -->
    <circle cx="0" cy="0" r="95" fill="#247bff" opacity="0.08"/>
    <circle cx="0" cy="0" r="82" fill="#ff354f" opacity="0.05"/>
    
    <!-- Outer dashed tech orbit -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#247bff" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner counter orbit -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#ff354f" stroke-width="1" stroke-dasharray="4,6" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Main Avatar Disk -->
    <circle cx="0" cy="0" r="65" fill="url(#hero-avatar-grad)"/>
    <circle cx="0" cy="0" r="63" fill="#070b16"/>
    
    <!-- Avatar Initials -->
    <text x="0" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#hero-avatar-grad)" letter-spacing="1">JS</text>
    
    <!-- Status indicator pip -->
    <circle cx="48" cy="45" r="10" fill="#070b16"/>
    <circle cx="48" cy="45" r="7" fill="#10b981"/>
  </g></g>
</svg>

