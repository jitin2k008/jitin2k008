<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="stack-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#162035" opacity="0.6"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="stack-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1a2744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="stack-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <linearGradient id="stack-chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <style>
      .st-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #f8fafc;
        letter-spacing: -0.3px;
      }
      .st-sub {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #247bff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .st-chip-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .st-chip-category {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #64748b;
        letter-spacing: 1px;
      }
      .st-orbit-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #ffffff;
      }

      /* CSS animations for fading in */
      .st-fade {
        animation: st-appear 0.8s ease both;
      }
      @keyframes st-appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        animateTransform { display: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#070b16"/>
  <rect width="800" height="480" rx="16" fill="url(#stack-dots)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" fill="none" stroke="url(#stack-border-grad)" stroke-width="1.5"/>

  <!-- Header Header -->
  <g transform="translate(40, 36)"><g class="st-fade">
    <text x="0" y="0" class="st-sub">TECHNICAL ECOSYSTEM</text>
    <text x="0" y="24" class="st-title">Orbits of Competency &amp; Stack</text>
  </g></g>

  <!-- TOP ORBITAL CANVAS: centre (400, 200). Nodes move along their own ellipses (animateMotion),
       so they stay inside the band between the header and the chips. -->
  <g id="orbital-system" transform="translate(400, 200)">
    <circle cx="0" cy="0" r="120" fill="#247bff" opacity="0.04"/>
    <circle cx="0" cy="0" r="64" fill="#ff354f" opacity="0.03"/>
    <g transform="rotate(20)">
      <ellipse cx="0" cy="0" rx="250" ry="62" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5,7" opacity="0.45"/>
      <g transform="translate(250.0, 0.0)">
        <g transform="rotate(-20)">
          <circle r="15" fill="#241010" stroke="#f43f5e" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="9" fill="#f43f5e">GIT</text>
        </g>
        <animateMotion dur="40s" repeatCount="indefinite" path="M0,0 a250,62 0 1,1 -500.0,-0.0 a250,62 0 1,1 500.0,0.0 z"/>
      </g>
      <g transform="translate(0.0, 62.0)">
        <g transform="rotate(-20)">
          <circle r="15" fill="#1c160b" stroke="#f97316" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="9" fill="#f97316">WEB</text>
        </g>
        <animateMotion dur="40s" repeatCount="indefinite" path="M0,0 a250,62 0 1,1 -0.0,-124.0 a250,62 0 1,1 0.0,124.0 z"/>
      </g>
      <g transform="translate(-250.0, 0.0)">
        <g transform="rotate(-20)">
          <circle r="15" fill="#0b1e2a" stroke="#0ea5e9" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#0ea5e9">NP</text>
        </g>
        <animateMotion dur="40s" repeatCount="indefinite" path="M0,0 a250,62 0 1,1 500.0,-0.0 a250,62 0 1,1 -500.0,0.0 z"/>
      </g>
      <g transform="translate(-0.0, -62.0)">
        <g transform="rotate(-20)">
          <circle r="15" fill="#132019" stroke="#10b981" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="9" fill="#10b981">CLI</text>
        </g>
        <animateMotion dur="40s" repeatCount="indefinite" path="M0,0 a250,62 0 1,1 0.0,124.0 a250,62 0 1,1 -0.0,-124.0 z"/>
      </g>
    </g>
    <g transform="rotate(0)">
      <ellipse cx="0" cy="0" rx="180" ry="56" fill="none" stroke="#ff354f" stroke-width="1.2" stroke-dasharray="5,7" opacity="0.45"/>
      <g transform="translate(180.0, 0.0)">
        <g transform="rotate(0)">
          <circle r="15" fill="#1f1118" stroke="#ff4b4b" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#ff4b4b">ST</text>
        </g>
        <animateMotion dur="28s" repeatCount="indefinite" path="M0,0 a180,56 0 1,0 -360.0,-0.0 a180,56 0 1,0 360.0,0.0 z"/>
      </g>
      <g transform="translate(-90.0, 48.5)">
        <g transform="rotate(0)">
          <circle r="15" fill="#201509" stroke="#f59e0b" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#f59e0b">SK</text>
        </g>
        <animateMotion dur="28s" repeatCount="indefinite" path="M0,0 a180,56 0 1,0 180.0,-97.0 a180,56 0 1,0 -180.0,97.0 z"/>
      </g>
      <g transform="translate(-90.0, -48.5)">
        <g transform="rotate(0)">
          <circle r="15" fill="#14112e" stroke="#818cf8" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#818cf8">PD</text>
        </g>
        <animateMotion dur="28s" repeatCount="indefinite" path="M0,0 a180,56 0 1,0 180.0,97.0 a180,56 0 1,0 -180.0,-97.0 z"/>
      </g>
    </g>
    <g transform="rotate(-20)">
      <ellipse cx="0" cy="0" rx="120" ry="50" fill="none" stroke="#247bff" stroke-width="1.2" stroke-dasharray="5,7" opacity="0.45"/>
      <g transform="translate(120.0, 0.0)">
        <g transform="rotate(20)">
          <circle r="15" fill="#0c182d" stroke="#38bdf8" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="11" fill="#38bdf8">PY</text>
        </g>
        <animateMotion dur="18s" repeatCount="indefinite" path="M0,0 a120,50 0 1,1 -240.0,-0.0 a120,50 0 1,1 240.0,0.0 z"/>
      </g>
      <g transform="translate(-120.0, 0.0)">
        <g transform="rotate(20)">
          <circle r="15" fill="#0c182d" stroke="#60a5fa" stroke-width="1.5"/>
          <text y="4" text-anchor="middle" font-family="monospace" font-weight="800" font-size="10" fill="#60a5fa">C++</text>
        </g>
        <animateMotion dur="18s" repeatCount="indefinite" path="M0,0 a120,50 0 1,1 240.0,-0.0 a120,50 0 1,1 -240.0,0.0 z"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="30" fill="#070b16" stroke="url(#stack-core-grad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="#0e172a"/>
    <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="0.5">DEV</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#38bdf8">CORE</text>
  </g>

  <!-- BOTTOM GROUPED STACK CHIPS -->
  <g transform="translate(40, 340)">
    <!-- Category 1: Languages & Fundamentals -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="st-chip-category">PRIMARY LANGUAGES</text>
      
      <!-- Python Chip -->
      <g transform="translate(0, 12)">
        <rect width="112" height="36" rx="8" fill="url(#stack-chip-grad)" stroke="#247bff" stroke-width="1.2"/>
        <circle cx="18" cy="18" r="4" fill="#38bdf8"/>
        <text x="32" y="22" class="st-chip-text">Python 3.x</text>
      </g>
      
      <!-- C++ Chip -->
      <g transform="translate(122, 12)">
        <rect width="90" height="36" rx="8" fill="url(#stack-chip-grad)" stroke="#00599c" stroke-width="1.2"/>
        <circle cx="18" cy="18" r="4" fill="#60a5fa"/>
        <text x="32" y="22" class="st-chip-text">C++ 17/20</text>
      </g>

      <!-- Problem Solving Chip -->
      <g transform="translate(222, 12)">
        <rect width="138" height="36" rx="8" fill="url(#stack-chip-grad)" stroke="#ff354f" stroke-width="1.2"/>
        <circle cx="18" cy="18" r="4" fill="#ff354f"/>
        <text x="32" y="22" class="st-chip-text">Algorithms &amp; DS</text>
      </g>
    </g>

    <!-- Category 2: Machine Learning & Analytics -->
    <g transform="translate(390, 0)">
      <text x="0" y="0" class="st-chip-category">DATA &amp; MACHINE LEARNING</text>

      <!-- Scikit-learn Chip -->
      <g transform="translate(0, 12)">
        <rect width="105" height="36" rx="8" fill="url(#stack-chip-grad)" stroke="#f59e0b" stroke-width="1"/>
        <text x="14" y="22" class="st-chip-text">scikit-learn</text>
      </g>

      <!-- Pandas & NumPy -->
      <g transform="translate(115, 12)">
        <rect width="125" height="36" rx="8" fill="url(#stack-chip-grad)" stroke="#818cf8" stroke-width="1"/>
        <text x="14" y="22" class="st-chip-text">pandas / NumPy</text>
      </g>

      <!-- Streamlit -->
      <g transform="translate(250, 12)">
        <rect width="80" height="36" rx="8" fill="url(#stack-chip-grad)" stroke="#ff4b4b" stroke-width="1"/>
        <text x="14" y="22" class="st-chip-text">Streamlit</text>
      </g>
    </g>

    <!-- Row 2: Web & Tools -->
    <g transform="translate(0, 70)">
      <!-- Single File & Vanilla Web -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="20" class="st-chip-text" fill="#94a3b8">Vanilla HTML5 / CSS3 / JS</text>
      </g>

      <!-- Git / GitHub -->
      <g transform="translate(178, 0)">
        <rect width="120" height="32" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="20" class="st-chip-text" fill="#94a3b8">Git &amp; Versioning</text>
      </g>

      <!-- Offline-first Architecture -->
      <g transform="translate(308, 0)">
        <rect width="180" height="32" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="20" class="st-chip-text" fill="#94a3b8">Offline-First Architectures</text>
      </g>

      <!-- Multi-Model Consensus -->
      <g transform="translate(498, 0)">
        <rect width="222" height="32" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="20" class="st-chip-text" fill="#94a3b8">Multi-Model Peer Comparison</text>
      </g>
    </g>
  </g>
</svg>

