<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 566" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="idd-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#162035" opacity="0.6"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="idd-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1a2744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Lanyard Strap Gradient -->
    <linearGradient id="idd-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="25%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#ff354f"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>

    <!-- Metal Clasp Gradient -->
    <linearGradient id="idd-metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Card Header Banner -->
    <linearGradient id="idd-banner-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <!-- Avatar Gradient -->
    <linearGradient id="idd-avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <!-- Holographic Foil Sweep Gradient -->
    <linearGradient id="idd-foil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ff354f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="idd-card-clip">
      <rect x="220" y="60" width="360" height="430" rx="16"/>
    </clipPath>

    <style>
      .idd-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 19px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      .idd-handle {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .idd-role {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .idd-badge-text {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #e2e8f0;
      }
      .idd-stat-val {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 14px;
        font-weight: 800;
        fill: #ffffff;
      }
      .idd-stat-lbl {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 600;
        fill: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Pendulum physics animation:
         0s-0.5s: Drop into place from above
         0.5s-3.5s: Damped settling oscillation (damped pendulum motion)
         3.5s onwards: Gentle continuous +/-1.7 degree harmonic swing */
      .idd-pendulum-rig {
        transform-origin: 400px 10px;
        animation: idd-drop-and-swing 6s cubic-bezier(0.25, 1, 0.5, 1) 1,
                   idd-continuous-swing 4.2s ease-in-out 6s infinite alternate;
      }

      @keyframes idd-drop-and-swing {
        0% {
          transform: translateY(-90px) rotate(0deg);
          opacity: 0;
        }
        12% {
          transform: translateY(0px) rotate(4.8deg);
          opacity: 1;
        }
        26% { transform: translateY(0px) rotate(-3.9deg); }
        42% { transform: translateY(0px) rotate(2.8deg); }
        60% { transform: translateY(0px) rotate(-1.9deg); }
        78% { transform: translateY(0px) rotate(1.8deg); }
        90% { transform: translateY(0px) rotate(-1.7deg); }
        100% { transform: translateY(0px) rotate(1.7deg); }
      }

      @keyframes idd-continuous-swing {
        0% { transform: rotate(1.7deg); }
        100% { transform: rotate(-1.7deg); }
      }

      /* Holographic foil sweep */
      .idd-foil-sweep {
        animation: idd-foil-anim 5s ease-in-out infinite;
      }
      @keyframes idd-foil-anim {
        0% { transform: translateX(-380px) translateY(-200px) rotate(-25deg); }
        40%, 100% { transform: translateX(450px) translateY(350px) rotate(-25deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .idd-pendulum-rig, .idd-foil-sweep {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="566" rx="16" fill="#070b16"/>
  <rect width="800" height="566" rx="16" fill="url(#idd-dots)"/>
  <rect x="1" y="1" width="798" height="564" rx="15" fill="none" stroke="url(#idd-border-grad)" stroke-width="1.5"/>

  <!-- Background Decorative Text -->
  <g transform="translate(40, 44)">
    <text x="0" y="0" font-family="monospace" font-size="11" font-weight="600" fill="#247bff" letter-spacing="1.5">HARDWARE / VERIFIED ID DASHBOARD</text>
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Credential Pass &amp; Team Metrics</text>
  </g>

  <!-- ================= PENDULUM RIG (SWINGS FROM TOP CLASP X=400, Y=10) ================= -->
  <g class="idd-pendulum-rig">
    <!-- Top Hanging Lanyard Webbing -->
    <rect x="388" y="0" width="24" height="78" fill="url(#idd-strap-grad)"/>
    <line x1="392" y1="0" x2="392" y2="78" stroke="#ffffff" stroke-dasharray="2,2" opacity="0.3"/>
    <line x1="408" y1="0" x2="408" y2="78" stroke="#ffffff" stroke-dasharray="2,2" opacity="0.3"/>

    <!-- Metallic Lobster Clasp & Ring -->
    <circle cx="400" cy="78" r="7" fill="none" stroke="url(#idd-metal-grad)" stroke-width="3"/>
    <rect x="393" y="83" width="14" height="15" rx="3" fill="url(#idd-metal-grad)"/>
    <rect x="396" y="88" width="8" height="3" fill="#1e293b"/>

    <g transform="translate(0, 36)">
    <!-- ================= THE ID CARD BODY (360 x 430) ================= -->
    <!-- Drop Shadow -->
    <rect x="224" y="66" width="360" height="426" rx="16" fill="#000000" opacity="0.45"/>
    
    <!-- Main Card Body -->
    <rect x="220" y="60" width="360" height="430" rx="16" fill="#0d1424" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Top Lanyard Slot in Card -->
    <rect x="380" y="68" width="40" height="6" rx="3" fill="#070b16" stroke="#334155" stroke-width="1"/>

    <!-- Card Header Banner -->
    <rect x="220" y="80" width="360" height="52" fill="url(#idd-banner-grad)"/>
    <text x="240" y="105" font-family="monospace" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5">PASS // DEEP WORK</text>
    <text x="560" y="105" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff" opacity="0.8" text-anchor="end">2026.11</text>

    <!-- Avatar Emblem with Initials (Offset over Banner) -->
    <g transform="translate(400, 155)">
      <circle cx="0" cy="0" r="42" fill="#0d1424"/>
      <circle cx="0" cy="0" r="38" fill="url(#idd-avatar-grad)"/>
      <circle cx="0" cy="0" r="35" fill="#070b16"/>
      <text x="0" y="12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">JS</text>
      <!-- Online Badge Pip -->
      <circle cx="26" cy="26" r="6" fill="#10b981" stroke="#0d1424" stroke-width="2"/>
    </g>

    <!-- Personal ID Information -->
    <text x="400" y="218" text-anchor="middle" class="idd-title">JITINPAL SINGH</text>
    <text x="400" y="235" text-anchor="middle" class="idd-handle">@jitin2k008</text>
    
    <g transform="translate(305, 248)">
      <rect x="0" y="0" width="190" height="22" rx="11" fill="#132038" stroke="#247bff" stroke-width="1"/>
      <text x="95" y="15" text-anchor="middle" class="idd-badge-text" fill="#38bdf8">STUDENT · PROBLEM SOLVER</text>
    </g>

    <!-- Verified Metrics Grid (2x2 Box) -->
    <g transform="translate(240, 282)">
      <!-- Metric 1: SolarGuard Consensus -->
      <rect x="0" y="0" width="155" height="56" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1"/>
      <text x="12" y="22" class="idd-stat-val" fill="#10b981">91.04%</text>
      <text x="12" y="40" class="idd-stat-lbl">3-Model Consensus</text>
      
      <!-- Metric 2: RF Accuracy -->
      <rect x="165" y="0" width="155" height="56" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1"/>
      <text x="177" y="22" class="idd-stat-val" fill="#38bdf8">96.60%</text>
      <text x="177" y="40" class="idd-stat-lbl">RF Test R² Metric</text>

      <!-- Metric 3: Team Technocrats -->
      <rect x="0" y="62" width="155" height="56" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1"/>
      <text x="12" y="84" class="idd-stat-val" fill="#ff354f">TECHNOCRATS</text>
      <text x="12" y="102" class="idd-stat-lbl">Team Leader (AI MUN)</text>

      <!-- Metric 4: Offline Architecture -->
      <rect x="165" y="62" width="155" height="56" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1"/>
      <text x="177" y="84" class="idd-stat-val" fill="#f59e0b">ZERO-DEP</text>
      <text x="177" y="102" class="idd-stat-lbl">Single-File Habit Engine</text>
    </g>

    <!-- Authentic Barcode Line Art & Identifier -->
    <g transform="translate(240, 412)">
      <line x1="0" y1="0" x2="320" y2="0" stroke="#1a2744" stroke-width="1"/>
      
      <!-- Vector Barcode pattern -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="3" height="26" fill="#cbd5e1"/>
        <rect x="5" y="0" width="1" height="26" fill="#cbd5e1"/>
        <rect x="8" y="0" width="4" height="26" fill="#cbd5e1"/>
        <rect x="15" y="0" width="2" height="26" fill="#cbd5e1"/>
        <rect x="19" y="0" width="5" height="26" fill="#cbd5e1"/>
        <rect x="27" y="0" width="2" height="26" fill="#cbd5e1"/>
        <rect x="31" y="0" width="1" height="26" fill="#cbd5e1"/>
        <rect x="34" y="0" width="4" height="26" fill="#cbd5e1"/>
        <rect x="41" y="0" width="3" height="26" fill="#cbd5e1"/>
        <rect x="46" y="0" width="1" height="26" fill="#cbd5e1"/>
        <rect x="50" y="0" width="6" height="26" fill="#cbd5e1"/>
        <rect x="58" y="0" width="2" height="26" fill="#cbd5e1"/>
        <rect x="62" y="0" width="3" height="26" fill="#cbd5e1"/>
        <rect x="68" y="0" width="1" height="26" fill="#cbd5e1"/>
        <rect x="71" y="0" width="4" height="26" fill="#cbd5e1"/>
        <rect x="78" y="0" width="5" height="26" fill="#cbd5e1"/>
        <rect x="85" y="0" width="2" height="26" fill="#cbd5e1"/>
        <rect x="90" y="0" width="3" height="26" fill="#cbd5e1"/>
        <rect x="95" y="0" width="1" height="26" fill="#cbd5e1"/>
        <rect x="98" y="0" width="4" height="26" fill="#cbd5e1"/>
      </g>

      <text x="130" y="19" font-family="monospace" font-size="11" fill="#64748b">ID: U091EK2H-2026-DELHI</text>
      <text x="130" y="36" font-family="monospace" font-size="10" fill="#10b981">● VERIFIED</text>
    </g>

    <!-- Holographic Foil Sweep Overlay (clipped to card) -->
    <g clip-path="url(#idd-card-clip)">
      <rect class="idd-foil-sweep" x="180" y="20" width="180" height="500" fill="url(#idd-foil-grad)"/>
    </g>
    </g>
  </g>
</svg>

