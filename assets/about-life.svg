<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="about-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#162035" opacity="0.6"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="about-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1a2744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="about-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#090f1d"/>
    </linearGradient>

    <linearGradient id="about-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <style>
      .about-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #f8fafc;
        letter-spacing: -0.3px;
      }
      .about-subtitle {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #247bff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .about-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .about-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        fill: #8b949e;
      }
      .about-h-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .about-h-quote {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        fill: #94a3b8;
        font-style: italic;
      }

      /* 3 Slides Carousel: 12s total loop, 4s per slide (33.3% each) */
      .slide-1, .slide-2, .slide-3 { transform-box: fill-box; transform-origin: center; }
      .slide-2, .slide-3 { opacity: 0; }
      .slide-1 { animation: slide-anim-1 12s infinite; }
      .slide-2 { animation: slide-anim-2 12s infinite; }
      .slide-3 { animation: slide-anim-3 12s infinite; }

      .prog-1 { animation: prog-anim-1 12s infinite; }
      .prog-2 { animation: prog-anim-2 12s infinite; }
      .prog-3 { animation: prog-anim-3 12s infinite; }

      @keyframes slide-anim-1 {
        0%, 3% { opacity: 0; transform: scale(0.95) translateY(10px); }
        6%, 30% { opacity: 1; transform: scale(1) translateY(0); }
        33.3%, 100% { opacity: 0; transform: scale(1.02) translateY(-10px); }
      }
      @keyframes slide-anim-2 {
        0%, 33.3% { opacity: 0; transform: scale(0.95) translateY(10px); }
        36.3%, 63.3% { opacity: 1; transform: scale(1) translateY(0); }
        66.6%, 100% { opacity: 0; transform: scale(1.02) translateY(-10px); }
      }
      @keyframes slide-anim-3 {
        0%, 66.6% { opacity: 0; transform: scale(0.95) translateY(10px); }
        69.6%, 96.6% { opacity: 1; transform: scale(1) translateY(0); }
        100% { opacity: 0; transform: scale(1.02) translateY(-10px); }
      }

      @keyframes prog-anim-1 {
        0% { width: 0px; opacity: 1; }
        33% { width: 70px; opacity: 1; }
        33.1%, 100% { width: 70px; opacity: 0.3; }
      }
      @keyframes prog-anim-2 {
        0%, 33.3% { width: 0px; opacity: 0.3; }
        33.4% { width: 0px; opacity: 1; }
        66.6% { width: 70px; opacity: 1; }
        66.7%, 100% { width: 70px; opacity: 0.3; }
      }
      @keyframes prog-anim-3 {
        0%, 66.6% { width: 0px; opacity: 0.3; }
        66.7% { width: 0px; opacity: 1; }
        99.9% { width: 70px; opacity: 1; }
        100% { width: 0px; opacity: 0.3; }
      }

      /* Entrance animations */
      .card-item {
        animation: card-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .ci-1 { animation-delay: 0.2s; }
      .ci-2 { animation-delay: 0.35s; }
      .ci-3 { animation-delay: 0.5s; }
      .ci-4 { animation-delay: 0.65s; }

      @keyframes card-appear {
        from { opacity: 0; transform: translateX(-15px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .slide-1, .slide-2, .slide-3, .prog-1, .prog-2, .prog-3, .card-item {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
        .slide-2, .slide-3 { display: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="#070b16"/>
  <rect width="800" height="400" rx="16" fill="url(#about-dots)"/>
  <rect x="1" y="1" width="798" height="398" rx="15" fill="none" stroke="url(#about-border-grad)" stroke-width="1.5"/>

  <!-- Left Column: Core Focus & Capabilities (x: 40 to 390) -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="about-subtitle">CORE DOMAINS &amp; DISCIPLINE</text>
    <text x="0" y="24" class="about-title">Capabilities &amp; Craft</text>

    <!-- Card 1: Problem Solving & Algorithms -->
    <g transform="translate(0, 48)"><g class="card-item ci-1">
      <rect width="340" height="58" rx="10" fill="url(#about-card-grad)" stroke="#1a2744" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#247bff"/>
      <circle cx="30" cy="29" r="16" fill="#14213d"/>
      <text x="30" y="34" font-size="16" text-anchor="middle">🧩</text>
      <text x="56" y="26" class="about-label">Hard Problem Solving</text>
      <text x="56" y="44" class="about-desc">Algorithms, discrete logic &amp; complexity</text>
    </g></g>

    <!-- Card 2: Systems & C++ -->
    <g transform="translate(0, 116)"><g class="card-item ci-2">
      <rect width="340" height="58" rx="10" fill="url(#about-card-grad)" stroke="#1a2744" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#38bdf8"/>
      <circle cx="30" cy="29" r="16" fill="#14213d"/>
      <text x="30" y="34" font-size="16" text-anchor="middle">⚡</text>
      <text x="56" y="26" class="about-label">C++ &amp; High Performance</text>
      <text x="56" y="44" class="about-desc">Data structures, memory discipline &amp; speed</text>
    </g></g>

    <!-- Card 3: Python & Data Engineering -->
    <g transform="translate(0, 184)"><g class="card-item ci-3">
      <rect width="340" height="58" rx="10" fill="url(#about-card-grad)" stroke="#1a2744" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#ff354f"/>
      <circle cx="30" cy="29" r="16" fill="#14213d"/>
      <text x="30" y="34" font-size="16" text-anchor="middle">🐍</text>
      <text x="56" y="26" class="about-label">Python &amp; ML Architecture</text>
      <text x="56" y="44" class="about-desc">scikit-learn, Random Forests &amp; consensus</text>
    </g></g>

    <!-- Card 4: Product & Pragmatism -->
    <g transform="translate(0, 252)"><g class="card-item ci-4">
      <rect width="340" height="58" rx="10" fill="url(#about-card-grad)" stroke="#1a2744" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#10b981"/>
      <circle cx="30" cy="29" r="16" fill="#14213d"/>
      <text x="30" y="34" font-size="16" text-anchor="middle">🛠️</text>
      <text x="56" y="26" class="about-label">Offline-First &amp; Single-File Apps</text>
      <text x="56" y="44" class="about-desc">Zero-dependency vanilla apps &amp; dashboards</text>
    </g></g>
  </g>

  <!-- Divider Line -->
  <line x1="420" y1="40" x2="420" y2="360" stroke="#1a2744" stroke-dasharray="4,6" stroke-width="1"/>

  <!-- Right Column: Animated Interests Carousel (x: 450 to 760) -->
  <g transform="translate(450, 36)">
    <text x="0" y="0" class="about-subtitle">WHEN STEPPED AWAY</text>
    <text x="0" y="24" class="about-title">Life &amp; Hobbies</text>

    <!-- Carousel Container Box -->
    <rect x="0" y="48" width="310" height="236" rx="14" fill="url(#about-card-grad)" stroke="#1a2744" stroke-width="1"/>
    
    <!-- Background glow inside carousel -->
    <circle cx="155" cy="140" r="70" fill="#247bff" opacity="0.05"/>

    <!-- Slide 1: Gaming -->
    <g transform="translate(0, 48)"><g class="slide-1">
      <circle cx="155" cy="80" r="38" fill="#14213d" stroke="#247bff" stroke-width="1.5"/>
      <text x="155" y="88" font-size="34" text-anchor="middle">🎮</text>
      <text x="155" y="145" class="about-h-title" text-anchor="middle">Gaming</text>
      <text x="155" y="170" class="about-h-quote" text-anchor="middle">"Analyzing metas, tactical reflexes &amp; worlds"</text>
      <rect x="105" y="190" width="100" height="24" rx="12" fill="#1e293b"/>
      <text x="155" y="206" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">STRATEGY &amp; FPS</text>
    </g></g>

    <!-- Slide 2: Traveling -->
    <g transform="translate(0, 48)"><g class="slide-2">
      <circle cx="155" cy="80" r="38" fill="#14213d" stroke="#10b981" stroke-width="1.5"/>
      <text x="155" y="88" font-size="34" text-anchor="middle">✈️</text>
      <text x="155" y="145" class="about-h-title" text-anchor="middle">Traveling</text>
      <text x="155" y="170" class="about-h-quote" text-anchor="middle">"New perspectives, unfamiliar roads &amp; cultures"</text>
      <rect x="95" y="190" width="120" height="24" rx="12" fill="#1e293b"/>
      <text x="155" y="206" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">EXPEDITIONS &amp; CITIES</text>
    </g></g>

    <!-- Slide 3: Reading -->
    <g transform="translate(0, 48)"><g class="slide-3">
      <circle cx="155" cy="80" r="38" fill="#14213d" stroke="#ff354f" stroke-width="1.5"/>
      <text x="155" y="88" font-size="34" text-anchor="middle">📚</text>
      <text x="155" y="145" class="about-h-title" text-anchor="middle">Reading</text>
      <text x="155" y="170" class="about-h-quote" text-anchor="middle">"Deep dives into science, philosophy &amp; code"</text>
      <rect x="95" y="190" width="120" height="24" rx="12" fill="#1e293b"/>
      <text x="155" y="206" font-family="monospace" font-size="11" fill="#ff354f" text-anchor="middle">KNOWLEDGE EXPANSION</text>
    </g></g>

    <!-- Progress Segment Bars (3 segments for 3 slides) -->
    <g transform="translate(40, 304)">
      <!-- Segment 1 Track & Bar -->
      <rect x="0" y="0" width="70" height="4" rx="2" fill="#1e293b"/>
      <rect x="0" y="0" width="0" height="4" rx="2" fill="#247bff" class="prog-1"/>

      <!-- Segment 2 Track & Bar -->
      <rect x="80" y="0" width="70" height="4" rx="2" fill="#1e293b"/>
      <rect x="80" y="0" width="0" height="4" rx="2" fill="#10b981" class="prog-2"/>

      <!-- Segment 3 Track & Bar -->
      <rect x="160" y="0" width="70" height="4" rx="2" fill="#1e293b"/>
      <rect x="160" y="0" width="0" height="4" rx="2" fill="#ff354f" class="prog-3"/>
    </g>

    <text x="155" y="332" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">AUTO-CYCLING 4s PER INTEREST</text>
  </g>
</svg>

