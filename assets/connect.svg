<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="conn-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#162035" opacity="0.6"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="conn-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1a2744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="conn-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="conn-insta-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed373"/>
      <stop offset="25%" stop-color="#f15245"/>
      <stop offset="50%" stop-color="#d92e7f"/>
      <stop offset="75%" stop-color="#9b36b7"/>
      <stop offset="100%" stop-color="#515ecf"/>
    </linearGradient>

    <linearGradient id="conn-char-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <style>
      .conn-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -0.3px;
      }
      .conn-sub {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #247bff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .conn-card-name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #ffffff;
      }
      .conn-card-handle {
        font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
        font-size: 12px;
        fill: #94a3b8;
      }
      .conn-card-tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #38bdf8;
      }

      /* Animated nudging arrows */
      .conn-nudge-arrow {
        animation: conn-nudge 1.6s ease-in-out infinite alternate;
      }
      @keyframes conn-nudge {
        0% { transform: translateX(0px); opacity: 0.5; }
        100% { transform: translateX(10px); opacity: 1; }
      }

      /* Stylized avatar gentle floating */
      .conn-char-float {
        animation: conn-float 3.5s ease-in-out infinite alternate;
      }
      @keyframes conn-float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      /* Hover highlight pulse */
      .conn-card-pulse {
        animation: conn-glow 4s ease-in-out infinite alternate;
      }
      @keyframes conn-glow {
        0% { stroke-opacity: 0.4; }
        100% { stroke-opacity: 0.9; }
      }

      @media (prefers-reduced-motion: reduce) {
        .conn-nudge-arrow, .conn-char-float, .conn-card-pulse {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="#070b16"/>
  <rect width="800" height="360" rx="16" fill="url(#conn-dots)"/>
  <rect x="1" y="1" width="798" height="358" rx="15" fill="none" stroke="url(#conn-border-grad)" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="conn-sub">COMMUNICATION &amp; NETWORK</text>
    <text x="0" y="24" class="conn-title">Get In Touch &amp; Follow The Journey</text>
  </g>

  <!-- ================= LEFT: STYLIZED CHARACTER / POINTER AVATAR ================= -->
  <g transform="translate(130, 205)"><g class="conn-char-float">
    <!-- Ambient back glow -->
    <circle cx="0" cy="0" r="80" fill="#247bff" opacity="0.06"/>
    
    <!-- Outer concentric radar ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#247bff" stroke-width="1" stroke-dasharray="3,6" opacity="0.3"/>
    <circle cx="0" cy="0" r="60" fill="#0d1424" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Stylized Illustrated Figure Silhouette -->
    <!-- Head -->
    <circle cx="0" cy="-22" r="18" fill="url(#conn-char-grad)"/>
    <!-- Glasses line -->
    <rect x="-12" y="-24" width="24" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    
    <!-- Torso / Hoodie -->
    <path d="M -30 28 C -30 -3, -18 -8, 0 -8 C 18 -8, 30 -3, 30 28 Z" fill="#0b172a"/>
    <path d="M -15 28 C -15 10, -8 4, 0 4 C 8 4, 15 10, 15 28 Z" fill="url(#conn-char-grad)" opacity="0.8"/>

    <!-- Outstretched Right-Pointing Arm & Pointer Gesture -->
    <!-- Arm reaching right -->
    <path d="M 12 -4 Q 45 -4, 75 0 Q 82 2, 88 5 L 82 12 Q 55 8, 18 10 Z" fill="#0b172a" stroke="#247bff" stroke-width="1"/>
    
    <!-- Pointer Hand & Finger -->
    <g transform="translate(86, 4)">
      <!-- Hand palm -->
      <circle cx="0" cy="2" r="5" fill="#38bdf8"/>
      <!-- Index finger pointing directly at the cards -->
      <rect x="0" y="0" width="20" height="4" rx="2" fill="#38bdf8"/>
      <!-- Laser pulse from fingertip -->
      <circle cx="20" cy="2" r="3" fill="#ffffff">
        <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Nudging Arrow Vectors -->
    <g transform="translate(118, 0)"><g class="conn-nudge-arrow">
      <path d="M 0 -8 L 8 0 L 0 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 10 -8 L 18 0 L 10 8" fill="none" stroke="#247bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
      <path d="M 20 -8 L 28 0 L 20 8" fill="none" stroke="#ff354f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    </g></g>
  </g></g>

  <!-- ================= RIGHT: GENEROUSELY SPACED SOCIAL CARDS ================= -->
  <g transform="translate(340, 80)">
    
    <!-- ================= CARD 1: LINKEDIN ================= -->
    <g transform="translate(0, 0)">
      <!-- Card background -->
      <rect width="420" height="66" rx="12" fill="url(#conn-card-grad)" stroke="#0a66c2" stroke-width="1.2" class="conn-card-pulse"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#0a66c2"/>
      
      <!-- LinkedIn Vector Icon Box -->
      <rect x="18" y="14" width="38" height="38" rx="8" fill="#0a66c2"/>
      <text x="37" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">in</text>

      <!-- Text details -->
      <text x="70" y="32" class="conn-card-name">LinkedIn</text>
      <text x="70" y="49" class="conn-card-handle">in/jitinpal-singh-726931433</text>
      
    </g>

    <!-- ================= CARD 2: GITHUB ================= -->
    <g transform="translate(0, 82)">
      <!-- Card background -->
      <rect width="420" height="66" rx="12" fill="url(#conn-card-grad)" stroke="#247bff" stroke-width="1.2" class="conn-card-pulse"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#247bff"/>

      <!-- GitHub Octocat / Terminal Icon Box -->
      <rect x="18" y="14" width="38" height="38" rx="8" fill="#1e293b"/>
      <!-- Clean Octocat Silouette Path -->
      <path d="M 37 20 C 31 20 26 25 26 31 C 26 36 29 40 33 42 C 34 42 34 41 34 41 L 34 38 C 30 39 29 37 29 37 C 29 36 28 35 28 35 C 27 34 28 34 28 34 C 29 34 30 35 30 35 C 31 36 32 36 33 35 C 33 34 34 34 34 33 C 31 33 28 32 28 27 C 28 26 28 25 29 24 C 29 24 28 22 29 20 C 29 20 30 20 32 21 C 33 21 35 21 37 21 C 39 21 41 21 42 21 C 44 20 45 20 45 20 C 46 22 45 24 45 24 C 46 25 46 26 46 27 C 46 32 43 33 40 33 C 40 34 41 35 41 36 L 41 41 C 41 41 41 42 42 42 C 45 40 48 36 48 31 C 48 25 43 20 37 20 Z" fill="#ffffff"/>

      <!-- Text details -->
      <text x="70" y="32" class="conn-card-name">GitHub</text>
      <text x="70" y="49" class="conn-card-handle">github.com/jitin2k008</text>

    </g>

    <!-- ================= CARD 3: INSTAGRAM ================= -->
    <g transform="translate(0, 164)">
      <!-- Card background -->
      <rect width="420" height="66" rx="12" fill="url(#conn-card-grad)" stroke="#ff354f" stroke-width="1.2" class="conn-card-pulse"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="url(#conn-insta-grad)"/>

      <!-- Instagram Camera Icon Box -->
      <rect x="18" y="14" width="38" height="38" rx="8" fill="url(#conn-insta-grad)"/>
      <rect x="26" y="22" width="22" height="22" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="37" cy="33" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="43" cy="27" r="1.5" fill="#ffffff"/>

      <!-- Text details -->
      <text x="70" y="32" class="conn-card-name">Instagram</text>
      <text x="70" y="49" class="conn-card-handle">@jitin2k008</text>

    </g>
  </g>

  <text x="550" y="338" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1">TAP THE BUTTONS BELOW TO OPEN</text>
</svg>

